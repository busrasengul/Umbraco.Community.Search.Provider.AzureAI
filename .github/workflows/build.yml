name: Build and test

on:
  push:
    branches: [ main, v17, v18, v19 ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/Umbraco.Community.Search.Provider.AzureAI.slnx -c Release

      - name: Test
        run: dotnet test src/Umbraco.Community.Search.Provider.AzureAI.Tests/Umbraco.Community.Search.Provider.AzureAI.Tests.csproj -c Release --no-build
