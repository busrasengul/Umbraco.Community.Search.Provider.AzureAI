name: Release Package

# Starts when a version tag is pushed, e.g. 17.0.0 or 19.0.0-beta1.
# Tag from the branch that matches the Umbraco major (v17, v18 or v19).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet trusted publishing verify this workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/Umbraco.Community.Search.Provider.AzureAI.Tests/Umbraco.Community.Search.Provider.AzureAI.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/Umbraco.Community.Search.Provider.AzureAI/Umbraco.Community.Search.Provider.AzureAI.csproj -c Release -o artifacts /p:Version=${{ github.ref_name }}

      # Trusted publishing: exchanges the GitHub OIDC token for a NuGet API key valid for one hour
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: busrasengul # nuget.org profile name

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
